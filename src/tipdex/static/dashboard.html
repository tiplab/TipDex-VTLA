<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TipDex_VTLA · VASE + TACE + q</title>
<style>body{font:16px system-ui;background:#101925;color:#e8f0fc;margin:0}main{max-width:1000px;margin:48px auto;padding:24px}h1{font-size:27px}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{flex:1;min-width:200px;background:#1b2b40;padding:24px;border-radius:14px}.value{font-size:42px;margin:14px 0}small{color:#a7bad3}a{color:#91bdff}canvas{width:520px;max-width:100%;height:auto;image-rendering:pixelated;border:1px solid #3d5677}#state{color:#a7bad3}#error{color:#ffbe9d}</style>
<main><h1>TipDex_VTLA · 实时可靠性</h1><p id="state">等待模型状态</p><div class="cards"><div class="card">VASE · qv<div class="value" id="qv">—</div><small>视觉动作一致性分数</small></div><div class="card">TACE · 触觉扣分<div class="value" id="decrement">—</div><small id="verification">等待核验</small></div><div class="card">最终分数 · q<div class="value" id="q">—</div><small id="active">等待推理</small></div></div><p id="error"></p><h2>预测触觉热图</h2><p>raw364 → 14 × 26，按寄存器顺序排列。<select id="frame"></select></p><canvas width="26" height="14" id="heatmap"></canvas><p><a href="/config">推理配置</a></p></main>
<script>let forecast=null;const fmt=x=>Number.isFinite(x)?x.toFixed(4):'—';function draw(){if(!forecast)return;let i=Number(document.querySelector('#frame').value)||0,v=forecast.predicted_normalized[i];if(!v)return;let c=document.querySelector('#heatmap').getContext('2d'),im=c.createImageData(26,14);v.forEach((x,k)=>{im.data[4*k]=255*x;im.data[4*k+1]=190*Math.sqrt(x);im.data[4*k+2]=255*(1-x);im.data[4*k+3]=255});c.putImageData(im,0,0)}document.querySelector('#frame').onchange=draw;
async function refresh(){try{let r=await fetch('/status');if(!r.ok)throw Error('模型服务尚未加载');let s=await r.json(),v=s.last||{};document.querySelector('#state').textContent=`模型 ${s.ready?'已就绪':'加载中'} · 配置 ${s.config.profile} · H=${s.config.forecast_horizon}`;document.querySelector('#qv').textContent=fmt(v.q_v);document.querySelector('#q').textContent=fmt(v.q_exec);document.querySelector('#decrement').textContent=fmt(v.tactile_decrement);document.querySelector('#verification').textContent=v.tactile_verification==='verified'?`已核验 · MAE ${fmt(v.tactile_error)}`:'无合格预测 · e=0';document.querySelector('#active').textContent=v.tace_active?'TACE 已参与本次推理':'等待推理';document.querySelector('#error').textContent=v.forecast_unavailable_reason||'';if(v.forecast){forecast=v.forecast;let select=document.querySelector('#frame');if(select.options.length!==forecast.target_times.length){select.replaceChildren();forecast.target_times.forEach((_,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`第 ${i+1} 帧`;select.append(o)})}draw()}}catch(e){document.querySelector('#state').textContent=e.message}setTimeout(refresh,500)}refresh();</script></html>
