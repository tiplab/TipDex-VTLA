<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TipDex_VTLA · 推理配置</title><style>
body{font:16px system-ui;background:#f3f5f8;color:#18283c;margin:0}main{max-width:850px;margin:48px auto;padding:28px;background:white;border-radius:16px}h1{font-size:28px}label{display:grid;grid-template-columns:1fr 200px;gap:16px;margin:16px 0}input,select,button{font:inherit;padding:9px;border:1px solid #c4cfdd;border-radius:6px}button{background:#154c91;color:white;cursor:pointer}pre{background:#f2f5f9;padding:18px;overflow:auto}small{color:#536375}#message{white-space:pre-wrap}</style>
<main><h1>TipDex_VTLA 推理配置</h1><p>选择预设或调整参数，下载配置后通过 <code>--config inference.json</code> 加载。</p>
<label>配置预设<select id="preset"><option value="paper">论文方法</option><option value="tipdex">TipDex 部署</option><option value="custom">自定义</option></select></label>
<div id="fields"></div><p id="formula"></p><button id="save">校验并下载配置</button> <a href="/dashboard">查看 VASE + TACE + q</a><p id="message" role="status"></p><pre id="preview"></pre>
<small>配置文件在模型启动时生效。误差阈值从模型包的 forecast/contract.json 加载。</small></main>
<script>
let presets,current;const labels={visual_offset:'视觉分数偏置',visual_scale:'视觉分数缩放',residual_bound:'特征残差上界 b',gate_kappa:'门控 κ',maximum_tactile_decrement:'触觉最大扣分',forecast_horizon:'预测帧数 H',tactile_fusion:'触觉融合',seed:'随机种子'};
function draw(){document.querySelector('#fields').replaceChildren();for(const [k,label]of Object.entries(labels)){let row=document.createElement('label');row.append(label);let input=document.createElement(k==='tactile_fusion'?'select':'input');input.id=k;if(k==='tactile_fusion'){for(const v of ['context_concat','action_adapter']){let o=document.createElement('option');o.value=v;o.textContent=v==='context_concat'?'上下文拼接':'动作适配器';input.append(o)}}else{input.type='number';input.step=k==='forecast_horizon'||k==='seed'?'1':'0.01'}input.value=current[k];input.oninput=()=>{current[k]=k==='tactile_fusion'?input.value:Number(input.value);current.profile='custom';document.querySelector('#preset').value='custom';preview()};row.append(input);document.querySelector('#fields').append(row)}preview()}
function preview(){document.querySelector('#preview').textContent=JSON.stringify(current,null,2);document.querySelector('#formula').textContent=`视觉基准 = ${current.visual_offset} + ${current.visual_scale} × qv；触觉核验后最多降低 ${current.maximum_tactile_decrement}。`}
fetch('/presets').then(r=>r.json()).then(p=>{presets=p;current={...p.paper};draw()});document.querySelector('#preset').onchange=e=>{if(presets[e.target.value]){current={...presets[e.target.value]};draw()}else{current.profile='custom';preview()}};
document.querySelector('#save').onclick=async()=>{let r=await fetch('/validate-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(current)});let data=await r.json();if(!r.ok){document.querySelector('#message').textContent=data.error;return}let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='inference.json';a.click();URL.revokeObjectURL(url);document.querySelector('#message').textContent='配置已校验并下载。'};
</script></html>
